openapi: 3.0.3
info:
  title: GazFlow API
  version: 0.2.0
  description: Stub OpenAPI — routes principales post-MVP. Génération complète via utoipa prévue.
paths:
  /api/network:
    get:
      summary: Réseau actif (nœuds, pipes, gaz)
  /api/networks:
    get:
      summary: Liste des réseaux disponibles et réseau actif
      description: |
        Réponse JSON :
        - `active` (string) : id du dataset actif
        - `networks` (array) : métadonnées par réseau
          - `id` (string)
          - `tier` (string) : `demo` | `standard` | `large` | `x_large`
          - `node_count` (integer)
          - `recommended_demo` (boolean)
  /api/network/gas-composition:
    patch:
      summary: Met à jour la composition gaz
  /api/import:
    post:
      summary: Import réseau (GeoJSON, CSV, Shapefile)
  /api/simulate:
    post:
      summary: Simulation steady-state
  /api/simulate/timeseries:
    post:
      summary: Série temporelle 24h
  /api/simulate/transient:
    post:
      summary: Transitoire (mode quasi_steady ou pde)
      description: |
        Chaque pas (`TransientStepResult`) inclut :
        - `flows` : débit aval par conduite (affichage carte / Cesium)
        - `flows_in` : débit amont [Nm³/s] (PDE : flows[0] ; quasi-steady : = flows)
        - `flows_out` : débit aval [Nm³/s] (PDE : flows[n] ; quasi-steady : = flows)
        - `converged` : false si le pas Picard PDE n'a pas convergé (défaut true en QS)
        - requête : `mode` (`quasi_steady`|`pde`), `adaptive_dt`, `n_cells_per_pipe`,
          `initial_demands`, `initial_pressures` (CI nodale optionnelle, bar),
          `picard_relax` (optionnel, (0, 1], défaut solveur 0,35), `events`
          (CI spatiale conduites : pas sur ce contrat, Rust/corpus seulement)
  /api/simulate/compare:
    post:
      summary: Compare deux scénarios topologiques (ΔP, ΔQ)
  /api/scenarios:
    get:
      summary: Liste scénarios du dataset actif
    post:
      summary: Crée un scénario (diff vs baseline)
  /api/scenarios/{id}/apply:
    post:
      summary: Applique un scénario → réseau modifié
  /api/contingency:
    post:
      summary: Analyse N-1
  /api/contingency/export:
    post:
      summary: Export rapport N-1
  /api/calibrate:
    post:
      summary: Calage SCADA
  /api/exports:
    get:
      summary: Historique des exports
  /api/exports/{id}/download:
    get:
      summary: Télécharge un export archivé
  /api/ws/sim:
    get:
      summary: WebSocket simulation steady / timeseries / contingency
      description: |
        Messages client (tag `type`, snake_case) :
        - `start_simulation` : `options.robust_mode` (bool), `options.continuation_scales` (number[])
        - `start_timeseries_simulation` : `options.robust_mode` (bool)
        - `start_contingency_simulation`, `cancel_simulation`
        - `start_transient_simulation` : `mode`, `adaptive_dt`, `n_cells_per_pipe`,
          `events`, `initial_demands`, `initial_pressures`, `picard_relax`

        Messages serveur :
        - `started`, `iteration`, `snapshot`, `converged`, `cancelled`, `error`, …
        - `continuation_step` : `{ run_id, seq, step, total_steps, scale }` — palier de continuation de charge
        - `transient_started` / `transient_step` / `transient_finished` — streaming transitoire
  /api/nova/scenarios:
    get:
      summary: Liste des nominations `.scn` (bundlées + importées)
      description: Query optionnel `dataset_id` (défaut : dataset actif). Ne mute pas l'état global.
  /api/nova/validate:
    post:
      summary: Valide une nomination NoVa (verdict compact HTTP)
      description: |
        Charge le `.scn` (`scenario_id`), fusionne les overrides de soutirage
        (un `0` explicite coupe le sink) et renvoie un verdict Camille sans
        cartes nodales P/Q. `dataset_id` optionnel : résout ce réseau **sans**
        changer le dataset actif de l'UI. Réponse : `run_id` pour relire le run
        (`GET /api/nova/runs/{id}`) ou hydrater la carte (`GET .../state`,
        `POST .../apply`, query UI `?run=`).
  /api/nova/runs:
    get:
      summary: Liste des runs NoVa récents (verdicts compacts, sans P/Q)
  /api/nova/runs/{id}:
    get:
      summary: Verdict compact d'un run (Workproba)
  /api/nova/runs/{id}/state:
    get:
      summary: État nodal P/Q d'un run (UI / carte)
  /api/nova/runs/{id}/apply:
    post:
      summary: Active le dataset du run si besoin et pose last_simulation (UI)
  /api/nova/capacity:
    post:
      summary: Étude capacité par sink (dichotomie)
  /api/nova/compare:
    post:
      summary: Compare deux nominations NoVa (ΔP, ΔQ, verdicts)
